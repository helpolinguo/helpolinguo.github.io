<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tapping out the times for La Skopo</title>
<!--
  THE ONE THING ON THE PAGE THAT CANNOT BE MEASURED FROM THE RECORDING.

  The reel under the doors needs a second for each line, and there is no
  reading it off the file: the arrangement is continuous — a choir over a
  crescendo — so the envelope has no phrase gaps to anchor on, and its
  brightness gives no clean vocal entry either. Autocorrelation of the
  detrended envelope does give one sharp answer, a strophe of 34.28 s, but
  a strophe is not a line and it does not say where the singing starts.

  So: TAP THEM. Play the song, press the space bar on each line as it
  begins, and this page prints the block of <p class="line"> back with the
  times filled in, ready to replace the one in index.html.

  IT IS NOT SERVED, AND IT READS THE POEM RATHER THAN KEEPING A COPY. The
  lines come from index.html itself, so there is one place where the poem
  lives and the tool cannot go stale against it.

      cd <this repository> && python3 -m http.server
      open http://localhost:8000/tools/tap.html
-->
<style>
:root{color-scheme:light dark;
  --paper:#fbfaf7; --ink:#1a1a1a; --muted:#6b6560; --rule:#e2ddd5; --azure:#007FFF}
@media (prefers-color-scheme:dark){:root{
  --paper:#16161a; --ink:#e8e4de; --muted:#9a938c; --rule:#2c2c33; --azure:#4da3ff}}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--paper);color:var(--ink);
  font:15px/1.6 system-ui,sans-serif;max-width:820px;margin-inline:auto}
h1{font-size:19px;margin:0 0 4px}
p.hint{color:var(--muted);font-size:13px;margin:0 0 18px}
kbd{font:600 12px/1 ui-monospace,monospace;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:3px 5px;background:var(--paper)}
.bar{position:sticky;top:0;background:var(--paper);padding:10px 0;
  border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center;
  flex-wrap:wrap;z-index:2}
button{font:600 13px/1 system-ui,sans-serif;padding:8px 12px;border-radius:7px;
  border:1px solid var(--rule);background:var(--paper);color:var(--azure);cursor:pointer}
button:hover{background:var(--azure);color:var(--paper);border-color:var(--azure)}
.clock{font:600 13px/1 ui-monospace,monospace;color:var(--muted);margin-left:auto}
ol{list-style:none;margin:16px 0;padding:0}
li{display:flex;gap:10px;align-items:baseline;padding:3px 6px;border-radius:5px}
li .t{font:600 12px/1.6 ui-monospace,monospace;color:var(--muted);
  min-width:62px;text-align:right}
li.done .t{color:var(--azure)}
li.next{background:color-mix(in srgb,var(--azure) 12%,transparent)}
li.next .t::after{content:"\25C0"}
li.credit{font-style:italic;color:var(--muted)}
textarea{width:100%;height:220px;font:12px/1.5 ui-monospace,monospace;
  background:var(--paper);color:var(--ink);border:1px solid var(--rule);
  border-radius:8px;padding:10px}
.err{color:#b4552d}
</style>
</head>
<body>
<h1>Tapping out the times for <em>La Skopo</em></h1>
<p class="hint">
  Press <kbd>space</kbd> on each line as it begins &mdash; the poem first,
  then the five credits. <kbd>&larr;</kbd> takes back the last tap,
  <kbd>&darr;</kbd> rewinds five seconds, <kbd>R</kbd> starts over. Then copy
  the block at the foot over the one in <code>index.html</code>.
</p>

<div class="bar">
  <button id="play">Play</button>
  <button id="back">&minus;5 s</button>
  <button id="undo">Undo</button>
  <button id="reset">Reset</button>
  <button id="copy">Copy the block</button>
  <span class="clock" id="clock">0:00.00 / 0:00</span>
</div>

<ol id="list"></ol>
<textarea id="out" readonly></textarea>

<audio id="song" src="/audio/la-skopo.mp3" preload="auto"></audio>

<script>
const song = document.getElementById('song');
const list = document.getElementById('list');
const out  = document.getElementById('out');
let lines = [];          /* {html, cls} straight out of index.html */
let taps  = [];          /* one second per line, in order */

/* THE POEM IS NOT KEPT HERE. It is read back out of the page it belongs
   to, so this tool can never drift from it: add a line there and it shows
   up here on the next reload. */
fetch('/index.html')
  .then(r => r.text())
  .then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    lines = [...doc.querySelectorAll('#reel .line')].map(el => ({
      html: el.innerHTML.trim(),
      cls:  el.getAttribute('class')
    }));
    if (!lines.length) throw new Error('no .line found inside #reel');
    draw();
  })
  .catch(e => {
    list.innerHTML = '<li class="err">Could not read the lines from ' +
      '/index.html — serve the repository root and open this page from it. (' +
      e.message + ')</li>';
  });

const fmt = t => Math.floor(t / 60) + ':' +
  (t % 60).toFixed(2).padStart(5, '0');

function draw() {
  list.innerHTML = '';
  lines.forEach((l, i) => {
    const li = document.createElement('li');
    li.className = (l.cls.includes('credit') ? 'credit ' : '') +
      (i < taps.length ? 'done' : i === taps.length ? 'next' : '');
    li.innerHTML = '<span class="t">' +
      (i < taps.length ? taps[i].toFixed(2) : '&mdash;') +
      '</span><span>' + l.html + '</span>';
    list.appendChild(li);
  });
  const next = list.querySelector('.next');
  if (next) next.scrollIntoView({block: 'center', behavior: 'smooth'});
  write();
}

/* The block, exactly as index.html wants it back: eight spaces of indent,
   the classes untouched, one line to a line. */
function write() {
  out.value = lines.map((l, i) =>
    '        <p class="' + l.cls + '" data-t="' +
    (i < taps.length ? taps[i].toFixed(2) : '0') + '">' + l.html + '</p>'
  ).join('\n');
}

function tap() {
  if (taps.length >= lines.length) return;
  taps.push(+song.currentTime.toFixed(2));
  draw();
}

document.getElementById('play') .onclick = () => song.paused ? song.play() : song.pause();
document.getElementById('back') .onclick = () => song.currentTime = Math.max(0, song.currentTime - 5);
document.getElementById('undo') .onclick = () => { taps.pop(); draw(); };
document.getElementById('reset').onclick = () => { taps = []; song.currentTime = 0; draw(); };
document.getElementById('copy') .onclick = () => {
  out.select(); navigator.clipboard.writeText(out.value);
};
song.addEventListener('play',  () => document.getElementById('play').textContent = 'Pause');
song.addEventListener('pause', () => document.getElementById('play').textContent = 'Play');

addEventListener('keydown', e => {
  if (e.key === ' ')          { e.preventDefault(); tap(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); taps.pop(); draw(); }
  if (e.key === 'ArrowDown')  { e.preventDefault(); song.currentTime = Math.max(0, song.currentTime - 5); }
  if (e.key.toLowerCase() === 'r') { taps = []; song.currentTime = 0; draw(); }
  if (e.key === 'Enter')      { e.preventDefault(); song.paused ? song.play() : song.pause(); }
});

setInterval(() => {
  document.getElementById('clock').textContent =
    fmt(song.currentTime) + ' / ' + (song.duration ? fmt(song.duration) : '0:00');
}, 60);
</script>
</body>
</html>
