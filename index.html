<style>
/* =====================================================================
   THE DOOR PAGE — ido.help
   =====================================================================

   The page carries one thing only: the book's mark, its motto, and three
   doors. It DOES NOT SCROLL — not on a screen, not on a phone: everything
   is measured in viewport units (svh, vw) and bounded by "min()", so that
   the central block fits inside the SMALLEST height the browser can offer
   — the one where the address bar is deployed. It is "svh" and not "vh"
   that guarantees this on iOS.
   ===================================================================== */

/* --- The typefaces ----------------------------------------------------
   Jost* Bold and Medium, subset to the glyphs this page uses (5.7 kB each
   instead of 59). They are the ones on the Dicionario's cover: the free
   revival of Futura, under the SIL OFL — see fonts/OFL.txt. They are
   served by the site itself: no third-party request, hence no stall and
   no tracker. */
@font-face{font-family:Jost;font-style:normal;font-weight:500;font-display:swap;
 src:url(fonts/Jost-Medium.woff2) format("woff2")}
@font-face{font-family:Jost;font-style:normal;font-weight:700;font-display:swap;
 src:url(fonts/Jost-Bold.woff2) format("woff2")}

/* --- The colours ------------------------------------------------------
   The five tokens of the three reading pages (paper, ink, muted, rule)
   plus the book's AZURE, #007FFF — the colour named halfway between blue
   and cyan, the one on both boards and on the Dicionario's disc. In dark
   mode the azure lightens: laid on #16161a, #007FFF does not hold the
   contrast of small text. */
:root{
  /* The page paints itself in both themes: it may as well say so to the
     browser, which then matches its own surfaces — scrollbars, fields,
     and the chrome of the installed application. */
  color-scheme:light dark;

  --azure:#007FFF;
  --paper:#fbfaf7; --ink:#1a1a1a; --muted:#6b6560; --rule:#e2ddd5;
  --veil:rgba(0,127,255,.055);
}
@media (prefers-color-scheme:dark){:root{
  --azure:#4da3ff;
  --paper:#16161a; --ink:#e8e4de; --muted:#9a938c; --rule:#2c2c33;
  --veil:rgba(77,163,255,.07);
}}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);
 font:16px/1.55 "Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
 -webkit-text-size-adjust:100%}

/* The stage fills the whole viewport. "dvh" makes it follow the address
   bar as that retracts, so the block stays optically centred; the content
   itself is sized in "svh" and therefore fits the narrowest case. */
.stage{position:fixed;inset:0;height:100vh;height:100dvh;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:16px;isolation:isolate}

/* =====================================================================
   1. THE SKY — "international auxiliary language" in sixty languages
   =====================================================================
   The words are placed by the script, never two overlapping, and none
   under the central block: the test is run on the REAL rectangles, which
   holds at any window size. They drift slowly, each at its own pace. The
   whole layer shifts a few pixels under the pointer — a parallax, not a
   movement. */
.sky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
 transform:translate3d(var(--px,0px),var(--py,0px),0);
 transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.word{position:absolute;white-space:nowrap;color:var(--muted);
 opacity:var(--op,.3);font-size:var(--sz,14px);letter-spacing:.01em;
 will-change:transform;
 animation:drift var(--dur,32s) ease-in-out var(--del,0s) infinite}
@keyframes drift{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(var(--dx),calc(var(--dy) * -1))}
  50%{transform:translate(calc(var(--dx) * -.6),var(--dy))}
  75%{transform:translate(var(--dx),calc(var(--dy) * .4))}
}
/* On a machine with a pointer, each word can be hovered and names its
   language. The layer therefore takes events back — but it alone: the
   central block sits above it (z-index), so the buttons stay reachable. */
@media (hover:hover) and (pointer:fine){
  .sky{pointer-events:auto}
  .word{cursor:help;transition:color .18s,opacity .18s}
  .word:hover{color:var(--azure);opacity:.95}
  .word::after{content:attr(data-lang);position:absolute;left:0;top:100%;
   font:600 10.5px/1.4 system-ui,sans-serif;letter-spacing:.08em;
   text-transform:uppercase;color:var(--azure);opacity:0;white-space:nowrap;
   transition:opacity .18s;pointer-events:none}
  .word:hover::after{opacity:.85}
}

/* =====================================================================
   2. THE MARK AND THE MOTTO
   =====================================================================
   A single measure governs the page: --width, the width of the logotype.
   The motto and the three doors align to it exactly. It is bounded by
   three values — the viewport width, its height, and an absolute maximum
   — and the smallest wins: the page therefore fits a phone held sideways
   as well as a large screen. */
.block{position:relative;z-index:2;
 --width:min(74vw,54svh,560px);
 width:var(--width);display:flex;flex-direction:column;align-items:center}
.mark{display:block;width:100%;margin:0;color:var(--azure);
 --star:var(--paper)}
.mark svg{display:block;width:100%;height:auto}
/* The star is invariant under a third of a turn: rotating it 120 degrees
   brings it back exactly onto itself. A click on the mark shows this.

   IT TURNS ABOUT THE CENTRE OF THE DISC, WHICH IS NOT THE CENTRE OF ITS
   OWN BOX. "center" put it there, and the rotation started 93 thousandths
   too high. The star's box is not centred on the disc because the figure
   is not: the long point at the top touches the circle, one radius from
   the centre, while the two long points at the bottom reach only half a
   radius down. The box is therefore 1.5 radii tall, and the centre of the
   disc falls one radius from the top — that is, at TWO THIRDS, exactly,
   not by approximation. Across the width the figure is symmetric, and the
   centre stays at one half. */
.mark .star{transform-box:fill-box;transform-origin:50% 66.6667%;
 transition:rotate 1s cubic-bezier(.34,1.2,.4,1)}
.mark button{display:block;width:100%;padding:0;border:0;background:none;
 cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
.mark button:focus-visible{outline:2px solid var(--azure);outline-offset:6px;
 border-radius:4px}

/* The motto is exactly as wide as the logotype: the text sits in an SVG of
   the same box, with "textLength", and it is the letter-spacing that
   stretches — not the letterforms. The agreement is therefore exact at any
   size, and does not depend on which font ended up loading. */
.motto{display:block;width:100%;margin:clamp(10px,1.8svh,20px) 0 0}
.motto svg{display:block;width:100%;height:auto}

/* =====================================================================
   3. THE THREE DOORS
   ===================================================================== */
.doors{display:flex;gap:9px;width:100%;margin-top:clamp(16px,3.4svh,34px)}
.door{flex:1 1 0;min-width:0;
 display:flex;align-items:center;justify-content:center;
 padding:clamp(9px,1.5svh,13px) 6px;
 border:1px solid var(--rule);border-radius:9px;background:var(--paper);
 color:var(--azure);text-decoration:none;
 font:500 clamp(13px,1.65vh + .8vw,17px)/1 Jost,system-ui,sans-serif;
 letter-spacing:.02em;white-space:nowrap;
 transition:background .16s,border-color .16s,color .16s,transform .16s}
.door:hover{background:var(--azure);border-color:var(--azure);color:var(--paper);
 transform:translateY(-2px)}
.door:active{transform:translateY(0)}
.door:focus-visible{outline:2px solid var(--azure);outline-offset:3px}
/* On a phone held upright, three words side by side become unreadable well
   before they run out of room: they then stack, still at the width of the
   logotype. */
@media (max-width:430px) and (orientation:portrait){
  .doors{flex-direction:column;gap:8px}
}

/* =====================================================================
   4. THE FOOT
   ===================================================================== */
.foot{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));
 z-index:2;text-align:center;color:var(--muted);font-size:12px;line-height:1.5;
 padding:0 16px}
@media (max-height:430px){.foot{display:none}}

/* =====================================================================
   THE TWO CORNER DISCS
   =====================================================================
   The page carries a global action in each of two opposite corners, and
   both wear the same disc: 42 px, 38 below 560 px of width, 24 px from
   both edges. It is the measure of the back button on the three books —
   see shared.css. The corner carries the same thing everywhere on the
   site, and the eye does not have to learn it twice.

   BOTTOM LEFT, the download. TOP RIGHT, the source code. Neither carries
   a word: the site addresses every language, and a label in Ido would say
   nothing to a reader who does not read Ido. The accessible names, and the
   labels that appear on hover, do stay in Ido — they are the interface,
   and the interface is in Ido throughout.
   ===================================================================== */
.corner{
  --margin:24px; --size:42px;
  position:fixed; z-index:12;
  width:var(--size); height:var(--size);
  padding:0; border:0; border-radius:50%;
  background:var(--paper);
  box-shadow:0 2px 11px rgba(0,0,0,.12);
  -webkit-tap-highlight-color:transparent;
  /* ITS OWN LAYER. WebKit does not reposition fixed elements continuously
     during scroll inertia. A 3D transform, even a null one, forces a
     composited layer the engine knows how to move separately. The hover
     transform must be 3D as well, or it undoes the promotion. */
  transform:translate3d(0,0,0);
  transition:box-shadow .16s, transform .16s;
}
.corner:hover{transform:translate3d(0,-2px,0);box-shadow:0 5px 16px rgba(0,0,0,.18)}
.corner:active{transform:translate3d(0,0,0)}
.corner:focus-visible{outline:2px solid var(--azure);outline-offset:5px}
@media (prefers-color-scheme:dark){
  .corner{box-shadow:0 2px 11px rgba(0,0,0,.5)}
  .corner:hover{box-shadow:0 5px 16px rgba(0,0,0,.62)}
}
@media (max-width:560px){.corner{--size:38px}}
.corner svg{display:block;width:100%;height:100%}

/* --- The download disc, bottom left ---------------------------------
   NO WORD, an icon and a ring that goes round during the fetch: an arrow,
   then a tick, then a bin. */
.download{
  left:max(var(--margin), env(safe-area-inset-left));
  bottom:max(var(--margin), env(safe-area-inset-bottom));
  top:calc(100svh - var(--size) - max(var(--margin), env(safe-area-inset-bottom)));
  cursor:pointer;
}
.download circle{fill:none;stroke-width:2.4}
.ring-track{stroke:var(--rule)}
/* The ring starts at the top and runs clockwise: hence the quarter turn
   backwards. Its circumference is 2*pi*20 = 125.66, and that number is the
   unit of the dash offset. */
.ring-progress{stroke:var(--azure);stroke-linecap:round;
  stroke-dasharray:125.66; stroke-dashoffset:125.66;
  transform:rotate(-90deg); transform-origin:50% 50%;
  transition:stroke-dashoffset .3s ease-out}
.glyph path{fill:none;stroke:var(--muted);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .16s}
.download:hover .glyph path{stroke:var(--azure)}
/* Only one of the three glyphs shows at a time. */
.g-check,.g-bin{display:none}
.download.ready .g-arrow{display:none}
.download.ready .g-check{display:block}
.download.ready .glyph path{stroke:var(--azure)}
.download.ready .ring-progress{stroke-dashoffset:0}
.download.confirming .g-arrow,.download.confirming .g-check{display:none}
.download.confirming .g-bin{display:block}
.download.confirming .glyph path{stroke:var(--warn,#b4552d)}
.download.confirming .ring-progress{stroke:var(--warn,#b4552d)}

/* The count, to the right of the disc and only during the fetch: "23 MB"
   reads everywhere, which a sentence does not. */
.count{position:absolute; left:calc(var(--size) + 11px); top:50%;
  transform:translateY(-50%); white-space:nowrap;
  font:600 12px/1 system-ui,sans-serif; letter-spacing:.03em;
  color:var(--muted); opacity:0; pointer-events:none; transition:opacity .2s}
.download.running .count{opacity:1}
@media (max-width:380px){.count{display:none}}

/* --- The source disc, top right -------------------------------------
   The same disc, in the opposite corner. THE FLOURISH IS A RHYME: on
   hover, a thin azure ring draws itself all the way round, clockwise, in
   exactly the stroke of the progress ring on the download disc opposite.
   The one corner measures a fetch, the other merely answers a glance —
   but the eye recognises the same gesture, and the two corners read as
   one pair rather than as two ornaments.

   The mark itself is GitHub's own octicon, laid in the site's azure at the
   centre of the same 44-unit box, so that ring and mark share a
   coordinate system and no number has to be repeated. */
.source{
  right:max(var(--margin), env(safe-area-inset-right));
  top:max(var(--margin), env(safe-area-inset-top));
  color:var(--azure);
}
.source .octicon{fill:currentColor}
.source .halo{
  fill:none; stroke:var(--azure); stroke-width:2.4; stroke-linecap:round;
  /* Same circumference as the progress ring — 2*pi*20 — and the same
     quarter turn backwards, so that the sweep starts at the top. */
  stroke-dasharray:125.66; stroke-dashoffset:125.66;
  transform:rotate(-90deg); transform-origin:50% 50%;
  transition:stroke-dashoffset .55s cubic-bezier(.3,.8,.3,1);
}
.source:hover .halo,
.source:focus-visible .halo{stroke-dashoffset:0}
/* The label, on hover only, and only where there is a real pointer. It is
   the twin of the one on the back button of the three books — same type,
   same azure ground — but hung on the other side. */
@media (hover:hover) and (pointer:fine){
  .source::after{
    content:"Kodexo";
    position:absolute; right:calc(var(--size) + 10px); top:50%;
    transform:translateY(-50%) translateX(6px);
    font:600 12px/1 system-ui,sans-serif; letter-spacing:.06em;
    color:var(--paper); background:var(--azure);
    padding:6px 9px; border-radius:6px;
    opacity:0; pointer-events:none; white-space:nowrap;
    transition:opacity .16s, transform .16s;
  }
  .source:hover::after{opacity:1; transform:translateY(-50%) translateX(0)}
  /* THE LABEL MUST NOT COUNT IN THE LINK'S NAME. The link is already named
     in Ido by its aria-label; the browser appends the pseudo-element's
     content, and the name became "La kodexo … Kodexo". The
     "content / alt-text" syntax gives the pseudo-element an empty
     alternative: it is seen, it is no longer spoken. It sits under a guard,
     because a browser that does not know the syntax would drop the whole
     declaration — and the label would not appear at all. */
  @supports (content:"a" / "b"){
    .source::after{content:"Kodexo" / ""}
  }
}

/* =====================================================================
   5. THE ENTRANCE — the wheel arrives, and lays down the letters
   =====================================================================
   On load, only the disc is visible at first: it comes in from the left,
   ROLLING, and the two letters are drawn as it passes them. Then the
   motto, the doors and the foot rise by one notch.

   THE DISTANCE IS NOT CHOSEN BY EYE. A rolling wheel turns through an
   angle proportional to the distance covered: a 120-degree turn is exactly
   one radius times 2*pi/3, that is 780.76 thousandths of an em. The
   journey is TWO such turns — 1561.52 — which has two happy consequences:

     1. the star being invariant under a third of a turn, it arrives in its
        canonical position with no correction whatsoever;
     2. at the start, the right edge of the disc falls at 249.3, and the
        ink of the I ends at 246: the disc covers the I exactly, no more
        and no less.

   The roll is therefore true, not mimed — and it is the same figure that a
   click then turns, by a third of a turn in its turn. */

/* The disc overflows the drawing's box while it comes in; the viewport
   crops it, since the stage does not scroll. */
.intro .mark svg{overflow:visible}

.intro .o-group{
  /* The group's box IS the disc's — the star is inscribed in it — so its
     middle is the centre of the disc, and it is about that centre that the
     wheel turns. */
  transform-box:fill-box; transform-origin:center;
  animation:roll 1.55s cubic-bezier(.42,.02,.22,1) both;
}
@keyframes roll{
  from{transform:translateX(-1561.52px) rotate(-240deg)}
  to  {transform:translateX(0) rotate(0deg)}
}

/* THE LETTERS ARE NOT ANIMATED: A CURTAIN UNCOVERS THEM. They were at
   first each clipped by their own animation, with their own delay — and
   the vertical cut came away from the disc, which had already rolled
   further. One saw the edge of the animation instead of seeing the wheel
   lay the letters down.

   The curtain is a rectangle the colour of the paper, laid OVER the
   letters and UNDER the disc, whose left edge follows the centre of the
   disc exactly: same duration, same delay, same easing curve, and a
   translation that is the SAME function of time. The two can therefore no
   longer fall out of step — this is not a setting, it is an identity.

   AND THE CUT IS INVISIBLE, because the disc is taller than the letters:
   its diameter is 745.6 against 700 of cap height. At the top of the
   capitals, where the disc is narrowest, it still extends 128.3
   thousandths either side of its centre. The curtain's edge, which passes
   through that centre, is therefore covered over the whole height at which
   it is painted.

   The curtain is confined to the box of the letters' ink: it erases itself
   as soon as it leaves that box, at the end of the roll as at rest. */
.intro .curtain{animation:sweep 1.55s cubic-bezier(.42,.02,.22,1) both}
@keyframes sweep{
  from{transform:translateX(-1561.52px)}
  to  {transform:translateX(0)}
}
.curtain{fill:var(--paper)}

/* The rest of the page rises by one notch, once the mark is laid down. */
.intro .motto{animation:rise .55s ease-out 1.02s both}
.intro .doors{animation:rise .55s ease-out 1.16s both}
.intro .foot {animation:rise .55s ease-out 1.30s both}
.intro .download{animation:fade-in .55s ease-out 1.42s both}
.intro .source  {animation:fade-in .55s ease-out 1.42s both}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* The sky rises on its own, more slowly: it must not compete with the
   wheel for attention. Only its opacity is animated — its transform is
   already spoken for by the parallax. */
.intro .sky{animation:fade-in 1.2s ease-out .55s both}
@keyframes fade-in{from{opacity:0} to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .word{animation:none}
  /* The whole entrance falls away: the page paints itself in its final
     state. */
  .intro .o-group,.intro .curtain,.intro .motto,
  .intro .doors,.intro .foot,.intro .sky,
  .intro .download,.intro .source{animation:none}
  .source .halo{transition:none}
  .sky{transition:none}
  .mark .star{transition:none}
  .door{transition:background .16s,color .16s}
}
</style>

<body>

<div class="stage">
  <div class="sky" id="sky" aria-hidden="true"></div>

  <div class="block">
    <h1 class="mark">
      <button type="button" id="spin" aria-label="Ido">
        <svg viewBox="74 -22.79 1736.76 745.57" role="img" aria-hidden="true" focusable="false">
          <defs>
          <!-- The box of the two letters' ink — x from 74 to 1019, y from 0
               to 700 — WIDENED BY THREE THOUSANDTHS on all four sides.
               Without that margin the curtain's edge fell exactly on the
               letters' edge, and the two antialiasings did not quite
               overlap: a one-pixel azure line was left on the baseline. The
               curtain being the colour of the paper, its own edges are
               invisible.
               The margin compromises nothing: at y = -3 as at y = 703, the
               disc still extends 119.9 thousandths either side of its
               centre, and so always covers the curtain's edge.
               The curtain is confined here, and disappears of itself when
               it leaves — at the end of the roll, and at rest. -->
          <clipPath id="letter-box" clipPathUnits="userSpaceOnUse">
            <rect x="71" y="-3" width="951" height="706"/>
          </clipPath>
          </defs>
          <g transform="translate(0,700) scale(1,-1)" fill="currentColor">
          <path class="letter letter-I" transform="translate(0,0)" d="M74.0 700.0V0.0H246.0V700.0Z"/>

  <!-- THE DOWNLOAD DISC. On the door page it occupies the place the back
       button occupies on the three books: same corner, same size, same

  <!-- THE SOURCE DISC. The corner opposite the download, and the same

       are. The mark is GitHub's own octicon, on a 16-unit box; the group
       carries it to the middle of the 44-unit box the ring lives in —
       25 units wide, so (44 - 25) / 2 = 9.5 of inset and 25/16 of scale.
       Nothing here is measured by eye. -->
  <a class="corner source" id="source"
     href="https://github.com/helpolinguo/helpolinguo.github.io"
     rel="noopener" aria-label="La kodexo dil sito, en GitHub">

      <g class="octicon" transform="translate(9.5,9.5) scale(1.5625)">
        <path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.19c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/>

<script>
/* =====================================================================
   THE SKY
   =====================================================================
   "International auxiliary language", in the national languages. The order
   deliberately alternates families and scripts: when the window is small,
   only the first words find a place, and that beginning has to be varied
   already.
   ===================================================================== */
const WORDS = [
 ["Français","fr","langue auxiliaire internationale"],
 ["Русский","ru","международный вспомогательный язык"],
 ["日本語","ja","国際補助語"],
 ["English","en","international auxiliary language"],
 ["العربية","ar","لغة مساعدة دولية"],
 ["Suomi","fi","kansainvälinen apukieli"],
 ["中文","zh","国际辅助语"],
 ["Español","es","lengua auxiliar internacional"],
 ["Türkçe","tr","uluslararası yardımcı dil"],
 ["Ελληνικά","el","διεθνής βοηθητική γλώσσα"],
 ["Deutsch","de","internationale Hilfssprache"],
 ["हिन्दी","hi","अंतर्राष्ट्रीय सहायक भाषा"],
 ["Polski","pl","międzynarodowy język pomocniczy"],
 ["한국어","ko","국제 보조어"],
 ["Italiano","it","lingua ausiliaria internazionale"],
 ["עברית","he","שפת עזר בינלאומית"],
 ["Magyar","hu","nemzetközi segédnyelv"],
 ["Kiswahili","sw","lugha saidizi ya kimataifa"],
 ["Português","pt","língua auxiliar internacional"],
 ["ไทย","th","ภาษาช่วยระหว่างประเทศ"],
 ["Nederlands","nl","internationale hulptaal"],
 ["Українська","uk","міжнародна допоміжна мова"],
 ["Latina","la","lingua auxiliaris internationalis"],
 ["Tiếng Việt","vi","ngôn ngữ phụ trợ quốc tế"],
 ["Svenska","sv","internationellt hjälpspråk"],
 ["فارسی","fa","زبان کمکی بین‌المللی"],
 ["Čeština","cs","mezinárodní pomocný jazyk"],
 ["ქართული","ka","საერთაშორისო დამხმარე ენა"],
 ["Català","ca","llengua auxiliar internacional"],
 ["Bahasa Indonesia","id","bahasa bantu internasional"],
 ["Dansk","da","internationalt hjælpesprog"],
 ["বাংলা","bn","আন্তর্জাতিক সহায়ক ভাষা"],
 ["Română","ro","limbă auxiliară internațională"],
 ["Հայերեն","hy","միջազգային օժանդակ լեզու"],
 ["Norsk","no","internasjonalt hjelpespråk"],
 ["Български","bg","международен спомагателен език"],
 ["Esperanto","eo","internacia helplingvo"],
 ["தமிழ்","ta","சர்வதேச துணை மொழி"],
 ["Slovenčina","sk","medzinárodný pomocný jazyk"],
 ["Қазақ","kk","халықаралық көмекші тіл"],
 ["Íslenska","is","alþjóðlegt hjálpartungumál"],
 ["Hrvatski","hr","međunarodni pomoćni jezik"],
 ["Монгол","mn","олон улсын туслах хэл"],
 ["Eesti","et","rahvusvaheline abikeel"],
 ["Српски","sr","међународни помоћни језик"],
 ["Interlingua","ia","lingua auxiliar international"],
 ["Lietuvių","lt","tarptautinė pagalbinė kalba"],
 ["Afrikaans","af","internasionale hulptaal"],
 ["Slovenščina","sl","mednarodni pomožni jezik"],
 ["Oʻzbek","uz","xalqaro yordamchi til"],
 ["Latviešu","lv","starptautiskā palīgvaloda"],
 ["Shqip","sq","gjuhë ndihmëse ndërkombëtare"],
 ["Gaeilge","ga","teanga chúnta idirnáisiúnta"],
 ["Bahasa Melayu","ms","bahasa bantuan antarabangsa"],
 ["Malti","mt","lingwa awżiljarja internazzjonali"],
 ["Cymraeg","cy","iaith gynorthwyol ryngwladol"],
 ["Galego","gl","lingua auxiliar internacional"],
 ["Euskara","eu","nazioarteko laguntza-hizkuntza"],
 ["Filipino","fil","pandaigdigang wikang pantulong"]
];

/* A PSEUDO-random draw, but from a fixed seed: the layout is the same on
   every visit for a given window. It was tuned by eye; true randomness
   would redo it on every load, and sometimes redo it worse. */
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296}}

const sky=document.getElementById('sky');
const block=document.querySelector('.block');
let placed=[];

function sow(){
  sky.textContent='';
  const W=sky.clientWidth, H=sky.clientHeight;
  if(!W||!H) return;

  const b=block.getBoundingClientRect();
  const f=document.querySelector('.foot').getBoundingClientRect();
  const keepOut=[];

  /* Type size follows the window: the sizes of a large screen would give
     three words and nothing else on a phone. */
  const scale=Math.min(1,W/1040)*(H<560?.86:1);
  const SIZES=[21,15,13,17,12,14,19,12.5,16,13.5];
  const rand=seeded(0x1D0);
  placed=[];

  /* On a small window the central block eats two thirds of the room:
     without loosening the gaps and multiplying the attempts, only six or
     seven words would be left, and the sky would be empty. */
  const narrow=W<560;
  const MARGIN=narrow?12:26, GAP=narrow?8:13,
        TRIES=narrow?260:110, MIN_SIZE=narrow?9.5:10.5;

  /* The central block, widened: nothing comes near it. */
  keepOut.push({x:b.left-MARGIN,y:b.top-MARGIN,w:b.width+2*MARGIN,h:b.height+2*MARGIN});
  if(f.height) keepOut.push({x:f.left,y:f.top-12,w:f.width,h:f.height+16});

  /* The two corner discs, and the room their labels take beside them —
     120 px to the right for the download count, and as much to the left
     for the source label. The margin is the block's, and for the same
     reason: words DRIFT once placed, by up to thirteen pixels. A reserve
     just wide enough for the rectangle would let a word drift in. */
  const d=document.querySelector('.download');
  if(d){const r=d.getBoundingClientRect();
    if(r.width) keepOut.push({x:r.left-MARGIN, y:r.top-MARGIN,
      w:r.width+MARGIN+120, h:r.height+2*MARGIN});}
  const s=document.querySelector('.source');
  if(s){const r=s.getBoundingClientRect();
    if(r.width) keepOut.push({x:r.left-MARGIN-120, y:r.top-MARGIN,
      w:r.width+MARGIN+120, h:r.height+2*MARGIN});}

  for(let i=0;i<WORDS.length;i++){
    const [name,code,text]=WORDS[i];
    const el=document.createElement('span');
    el.className='word'; el.lang=code; el.dir='auto';
    el.dataset.lang=name; el.textContent=text;
    const sz=Math.max(MIN_SIZE,SIZES[i%SIZES.length]*scale);
    el.style.setProperty('--sz',sz.toFixed(1)+'px');
    el.style.visibility='hidden'; el.style.left='0'; el.style.top='0';
    sky.appendChild(el);
    const w=el.offsetWidth, h=el.offsetHeight;
    if(w>W-24){el.remove();continue}

    let spot=null;
    for(let p=0;p<TRIES;p++){
      const x=12+rand()*(W-w-24), y=10+rand()*(H-h-20);
      const cand={x,y,w,h};
      if(keepOut.some(k=>overlaps(cand,k,0))) continue;
      if(placed.some(k=>overlaps(cand,k,GAP))) continue;
      spot=cand; break;
    }
    if(!spot){el.remove();continue}
    placed.push(spot);

    /* The further a word is from the centre, the more it asserts itself:
       the eye goes to the block, and the sky stays a background. */
    const dx=(spot.x+w/2)/W-.5, dy=(spot.y+h/2)/H-.5;
    const far=Math.min(1,Math.hypot(dx*1.15,dy)*2.1);
    el.style.setProperty('--op',(.17+far*.26).toFixed(3));
    el.style.left=Math.round(spot.x)+'px';
    el.style.top=Math.round(spot.y)+'px';
    el.style.setProperty('--dx',(4+rand()*9).toFixed(1)+'px');
    el.style.setProperty('--dy',(4+rand()*8).toFixed(1)+'px');
    el.style.setProperty('--dur',(26+rand()*26).toFixed(1)+'s');
    el.style.setProperty('--del',(-rand()*40).toFixed(1)+'s');
    el.style.visibility='';
  }
}
function overlaps(a,b,m){
  return a.x < b.x+b.w+m && a.x+a.w+m > b.x &&
         a.y < b.y+b.h+m && a.y+a.h+m > b.y;
}

/* Fonts change the width of words: sow once immediately, then again once
   they have arrived. */
sow();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(sow);

let sowTimer;
addEventListener('resize',()=>{clearTimeout(sowTimer);sowTimer=setTimeout(sow,160)});
addEventListener('orientationchange',()=>setTimeout(sow,260));

/* --- The parallax. A few pixels, and only under a real pointer. */
if(matchMedia('(hover:hover) and (pointer:fine)').matches &&
   !matchMedia('(prefers-reduced-motion:reduce)').matches){
  addEventListener('pointermove',e=>{
    const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
    sky.style.setProperty('--px',(-x*16).toFixed(1)+'px');
    sky.style.setProperty('--py',(-y*12).toFixed(1)+'px');
  },{passive:true});
}

/* =====================================================================
   THE END OF THE ENTRANCE
   =====================================================================
   The class is set in the HTML and not by the script: otherwise the page
   would be painted once in its final state before the script ran, and the
   entrance would begin with a jolt.

   It is removed when the wheel stops — which gives the drawing back its
   normal box — but also on the first gesture: whoever touches the page has
   better things to do than watch an animation. Removing it freezes
   everything in the final state, so the entrance can be cut short at any
   moment.

   Without JavaScript the class stays and nothing changes: the animation
   ends of itself on the final state.
   ===================================================================== */
const root=document.documentElement;
function endIntro(){root.classList.remove('intro')}
document.querySelector('.o-group')
  .addEventListener('animationend', endIntro, {once:true});
addEventListener('pointerdown', endIntro, {once:true});
addEventListener('keydown', endIntro, {once:true});
/* Safety net: an animation that never started — a tab opened in the
   background, for instance — must not leave the class in place. */
setTimeout(endIntro, 3200);

/* =====================================================================
   THE SERVICE WORKER — offline
   =====================================================================
   Placed at the root, its scope is the whole site: the door AND the three
   books, which are served from the same origin. The three repositories
   therefore carry nothing. The rules are detailed in sw.js.

   The body of the books — twelve megabytes — is only fetched ahead of time
   IF the page is running as an installed application. A visitor who merely
   passes through the door should not pay that price; for them, each page
   is cached as it is read.

   When the connection returns, the service worker itself is re-requested
   and made to revalidate what it holds: the texts are corrected often, and
   a copy must not outlive its correction.
   ===================================================================== */
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', {updateViaCache:'none'});
      await navigator.serviceWorker.ready;
      const installed = matchMedia('(display-mode: standalone)').matches
                        || navigator.standalone === true;
      const tell = m => reg.active && reg.active.postMessage(m);

      /* --- OFFLINE READING -------------------------------------------
         The whole site weighs some sixty megabytes: the three texts, the
         PDFs, the 52 languages and the 38 engraved plates in both of their
         resolutions.

         INSTALLED, the application fetches it of its own accord — that is
         what one expects of an application, and it is the closest moment
         to "added to the home screen" that a site can observe: iOS does
         not announce that addition.

         IN A TAB, nothing is fetched unasked: a passing visitor should not
         pay sixty megabytes. The button offers it, and the ring says how
         far along it is.

         The request for persistent storage keeps Chrome from evicting the
         cache automatically when space runs short; iOS grants it outright
         to home-screen applications. */
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

      const button = document.getElementById('download');
      const ring   = document.getElementById('ring');
      const count  = document.getElementById('count');
      const CIRCUM = 125.66;                    /* 2*pi*20, the circumference */
      const mb = o => Math.round(o / 1048576);
      let state = 'idle';                       /* idle | running | ready | confirming */
      let revertTimer = 0;

      /* The sky was sown before this button appeared — its rectangle was
         null then, and words could fall underneath it. Sow again now that
         it occupies its place. */
      button.hidden = false;
      sow();

      const setState = (next, label) => {
        state = next;
        button.classList.toggle('running',    next === 'running');
        button.classList.toggle('ready',      next === 'ready');
        button.classList.toggle('confirming', next === 'confirming');
        button.setAttribute('aria-label', label);
      };

      navigator.serviceWorker.addEventListener('message', ev => {
        const m = ev.data || {};
        if (m.kind === 'state' && m.total && m.done >= m.total) {
          ring.style.strokeDashoffset = 0;
          setState('ready', 'La tota sitio esas senrete disponebla — klikez por efacar');
        }
        if (m.kind === 'progress') {
          const p = m.total ? m.done / m.total : 0;
          ring.style.strokeDashoffset = (CIRCUM * (1 - p)).toFixed(2);
          /* The count states what has COME DOWN, with no denominator: it is
             the ring that says what share is done, and a total announced in
             advance would rest on an estimate — unversioned files do not
             announce their size. */
          count.textContent = mb(m.bytes) + ' MB';
          setState('running', 'Deskargas… ' + Math.round(p * 100) + ' %');
        }
        if (m.kind === 'done') {
          ring.style.strokeDashoffset = 0;
          count.textContent = mb(m.bytes) + ' MB';
          setState('ready', 'La tota sitio esas senrete disponebla — klikez por efacar');
        }
        if (m.kind === 'interrupted') {
          setState('idle', 'Interruptita — klikez por probar itere');
        }
        if (m.kind === 'cleared') {
          ring.style.strokeDashoffset = CIRCUM;
          count.textContent = '';
          setState('idle', 'Deskargar la tota sitio por senreta lekto');
        }
      });

      /* Three possible clicks, according to the state. In the "ready"
         state the first click only ARMS: erasing sixty-six megabytes by
         mistake would be painful, and a confirmation spelled out in words
         would amount to putting the text back. The glyph becomes a bin for
         four seconds; a second click erases, otherwise it reverts on its
         own. */
      button.addEventListener('click', () => {
        clearTimeout(revertTimer);
        if (state === 'idle') { tell('fetch-all'); setState('running', 'Deskargas…'); return; }
        if (state === 'ready') {
          setState('confirming', 'Efacar la deskargita kontenajo? Klikez itere por konfirmar');
          revertTimer = setTimeout(() => setState('ready',
            'La tota sitio esas senrete disponebla — klikez por efacar'), 4000);
          return;
        }
        if (state === 'confirming') { tell('clear'); return; }
      });

      tell('state');
      if (installed) setTimeout(() => tell('fetch-all'), 4000);

      addEventListener('online', () => {
        reg.update();
        tell('revalidate');
      });
    } catch (_) { /* without a service worker the page stays whole */ }
  });
}

/* --- The star. A third of a turn: the figure comes back onto itself. */
let degrees=0;
document.getElementById('spin').addEventListener('click',()=>{
  degrees+=120;
  document.querySelector('.mark .star').style.rotate=degrees+'deg';
});
</script>
