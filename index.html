<style>
/* =====================================================================
   PORDO-PAGINO — ido.help
   =====================================================================

   La page ne porte qu'une chose : la marque du livre, sa devise, et
   trois portes. Elle NE DEFILE PAS — ni sur ecran, ni sur telephone :
   tout est mesure en unites de vue (svh, vw) et borne par « min() »,
   de sorte que le bloc central tienne dans la plus PETITE hauteur que
   le navigateur puisse offrir — celle ou la barre d'adresse est
   deployee. C'est « svh » et non « vh » qui le garantit sur iOS.
   ===================================================================== */

/* --- Les polices ------------------------------------------------------
   Jost* Bold et Medium, reduites aux seuls signes de cette page (5,7 ko
   chacune au lieu de 59). Ce sont celles de la couverture du Dicionario :
   la reprise libre de la Futura, sous licence SIL OFL — voir
   polices/OFL.txt. Elles sont servies par le site meme : aucune requete
   vers un tiers, donc aucun temps mort et aucun traceur. */
@font-face{font-family:Jost;font-style:normal;font-weight:500;font-display:swap;
 src:url(polices/Jost-Medium.woff2) format("woff2")}
@font-face{font-family:Jost;font-style:normal;font-weight:700;font-display:swap;
 src:url(polices/Jost-Bold.woff2) format("woff2")}

/* --- Les couleurs -----------------------------------------------------
   Les cinq jetons des trois pages de lecture (papier, encre, gris,
   filet) plus l'AZUR du livre, #007FFF — la couleur nommee a mi-chemin
   du bleu et du cyan, celle des deux plats et du disque du Dicionario.
   En mode sombre l'azur s'eclaircit : pose sur #16161a, #007FFF ne tient
   pas le contraste d'un texte de petit corps. */
:root{
  /* La page se peint dans les deux thèmes : autant le dire au navigateur,
     qui accorde alors ses propres surfaces — barres de défilement, champs,
     et l'habillage de l'application enregistrée. */
  color-scheme:light dark;

  --azuro:#007FFF;
  --pap:#fbfaf7; --enk:#1a1a1a; --sub:#6b6560; --lin:#e2ddd5;
  --vualo:rgba(0,127,255,.055);
}
@media (prefers-color-scheme:dark){:root{
  --azuro:#4da3ff;
  --pap:#16161a; --enk:#e8e4de; --sub:#9a938c; --lin:#2c2c33;
  --vualo:rgba(77,163,255,.07);
}}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--pap);color:var(--enk);
 font:16px/1.55 "Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
 -webkit-text-size-adjust:100%}

/* La scene occupe la vue entiere. « dvh » la fait suivre la barre
   d'adresse quand elle se retracte, pour que le bloc reste optiquement
   centre ; le contenu, lui, est dimensionne en « svh » et tient donc
   dans le cas le plus etroit. */
.sceno{position:fixed;inset:0;height:100vh;height:100dvh;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:16px;isolation:isolate}

/* =====================================================================
   1. LE CIEL — « langue auxiliaire internationale » en soixante langues
   =====================================================================
   Les mots sont poses par le script, jamais deux qui se recouvrent, et
   aucun sous le bloc central : la mesure se fait sur les rectangles
   reels, ce qui vaut pour toute taille de fenetre. Ils derivent
   lentement, chacun a son pas. Le calque entier se decale de quelques
   pixels sous le pointeur — une parallaxe, pas un mouvement. */
.cielo{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
 transform:translate3d(var(--px,0px),var(--py,0px),0);
 transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.vorto{position:absolute;white-space:nowrap;color:var(--sub);
 opacity:var(--op,.3);font-size:var(--sz,14px);letter-spacing:.01em;
 will-change:transform;
 animation:flosar var(--dur,32s) ease-in-out var(--del,0s) infinite}
@keyframes flosar{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(var(--dx),calc(var(--dy) * -1))}
  50%{transform:translate(calc(var(--dx) * -.6),var(--dy))}
  75%{transform:translate(var(--dx),calc(var(--dy) * .4))}
}
/* Sur une machine a pointeur, chaque mot se laisse survoler et dit sa
   langue. Le calque reprend donc les evenements — mais lui seul : le
   bloc central est au-dessus (z-index), les boutons restent atteignables. */
@media (hover:hover) and (pointer:fine){
  .cielo{pointer-events:auto}
  .vorto{cursor:help;transition:color .18s,opacity .18s}
  .vorto:hover{color:var(--azuro);opacity:.95}
  .vorto::after{content:attr(data-lg);position:absolute;left:0;top:100%;
   font:600 10.5px/1.4 system-ui,sans-serif;letter-spacing:.08em;
   text-transform:uppercase;color:var(--azuro);opacity:0;white-space:nowrap;
   transition:opacity .18s;pointer-events:none}
  .vorto:hover::after{opacity:.85}
}

/* =====================================================================
   2. LA MARQUE ET LA DEVISE
   =====================================================================
   Une seule mesure commande la page : --largo, la largeur du logotype.
   La devise et les trois boutons s'y alignent exactement. Elle est
   bornee par trois valeurs — la largeur de la vue, sa hauteur, et un
   maximum absolu — et c'est la plus petite qui l'emporte : la page tient
   ainsi aussi bien sur un telephone couche que sur un grand ecran. */
.bloko{position:relative;z-index:2;
 --largo:min(74vw,54svh,560px);
 width:var(--largo);display:flex;flex-direction:column;align-items:center}
.marko{display:block;width:100%;margin:0;color:var(--azuro);
 --stelo:var(--pap)}
.marko svg{display:block;width:100%;height:auto}
/* L'etoile est invariante par rotation d'un tiers de tour : la faire
   tourner de 120 degres la ramene exactement sur elle-meme. Un clic sur
   la marque le fait voir.

   ELLE TOURNE AUTOUR DU CENTRE DU DISQUE, QUI N'EST PAS LE CENTRE DE SA
   PROPRE BOITE. « center » l'y placait, et la rotation partait de 93
   millièmes trop haut. La boite de l'etoile n'est pas centree sur le
   disque parce que la figure ne l'est pas : la longue pointe du haut
   touche le cercle, a un rayon du centre, tandis que les deux longues
   pointes du bas ne descendent qu'a un demi-rayon. La boite fait donc
   1,5 rayon de haut, et le centre du disque tombe a un rayon du sommet,
   c'est-a-dire aux DEUX TIERS — exactement, non par approximation.
   En largeur elle est symetrique, et le centre reste a la moitie. */
.marko .stelo{transform-box:fill-box;transform-origin:50% 66.6667%;
 transition:rotate 1s cubic-bezier(.34,1.2,.4,1)}
.marko button{display:block;width:100%;padding:0;border:0;background:none;
 cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
.marko button:focus-visible{outline:2px solid var(--azuro);outline-offset:6px;
 border-radius:4px}

/* La devise fait exactement la largeur du logotype : le texte est pose
   dans un SVG de meme boite, avec « textLength », et c'est l'approche
   qui s'etire — non le dessin des lettres. L'accord est donc exact a
   toute taille, et ne depend pas de la police qui aura ete chargee. */
.devizo{display:block;width:100%;margin:clamp(10px,1.8svh,20px) 0 0}
.devizo svg{display:block;width:100%;height:auto}

/* =====================================================================
   3. LES TROIS PORTES
   ===================================================================== */
.pordi{display:flex;gap:9px;width:100%;margin-top:clamp(16px,3.4svh,34px)}
.pordo{flex:1 1 0;min-width:0;
 display:flex;align-items:center;justify-content:center;
 padding:clamp(9px,1.5svh,13px) 6px;
 border:1px solid var(--lin);border-radius:9px;background:var(--pap);
 color:var(--azuro);text-decoration:none;
 font:500 clamp(13px,1.65vh + .8vw,17px)/1 Jost,system-ui,sans-serif;
 letter-spacing:.02em;white-space:nowrap;
 transition:background .16s,border-color .16s,color .16s,transform .16s}
.pordo:hover{background:var(--azuro);border-color:var(--azuro);color:var(--pap);
 transform:translateY(-2px)}
.pordo:active{transform:translateY(0)}
.pordo:focus-visible{outline:2px solid var(--azuro);outline-offset:3px}
/* Sur un telephone tenu debout, trois mots cote a cote deviennent
   illisibles bien avant d'etre a l'etroit : ils passent alors l'un sous
   l'autre, toujours a la largeur du logotype. */
@media (max-width:430px) and (orientation:portrait){
  .pordi{flex-direction:column;gap:8px}
}

/* =====================================================================
   4. LE PIED
   ===================================================================== */
.pedo{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));
 z-index:2;text-align:center;color:var(--sub);font-size:12px;line-height:1.5;
 padding:0 16px}
@media (max-height:430px){.pedo{display:none}}

/* =====================================================================
   LE DISQUE DE DESKARGO
   =====================================================================
   Mêmes mesures que le bouton de retour des trois livres — voir
   pordo.css : 42 px, 38 sous 560 px de large, à 24 px des deux bords.
   Le coin porte la même chose des deux côtés du site, et l'œil n'a pas à
   réapprendre.

   AUCUN MOT. Le site s'adresse à toutes les langues ; « Deskargar » n'en
   disait rien à qui ne lit pas l'ido. Une flèche, un crochet, une
   corbeille — et un anneau qui fait le tour pendant la prise. Le nom
   accessible, lui, reste en ido, pour les lecteurs d'écran. */
.deskargilo{
  --marjo:24px; --grando:42px;
  position:fixed; z-index:12;
  left:max(var(--marjo), env(safe-area-inset-left));
  bottom:max(var(--marjo), env(safe-area-inset-bottom));
  top:calc(100svh - var(--grando) - max(var(--marjo), env(safe-area-inset-bottom)));
  width:var(--grando); height:var(--grando);
  padding:0; border:0; border-radius:50%;
  background:var(--pap);
  box-shadow:0 2px 11px rgba(0,0,0,.12);
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  transform:translate3d(0,0,0);
  transition:box-shadow .16s, transform .16s;
}
.deskargilo:hover{transform:translate3d(0,-2px,0);box-shadow:0 5px 16px rgba(0,0,0,.18)}
.deskargilo:active{transform:translate3d(0,0,0)}
.deskargilo:focus-visible{outline:2px solid var(--azuro);outline-offset:5px}
@media (prefers-color-scheme:dark){
  .deskargilo{box-shadow:0 2px 11px rgba(0,0,0,.5)}
  .deskargilo:hover{box-shadow:0 5px 16px rgba(0,0,0,.62)}
}
@media (max-width:560px){.deskargilo{--grando:38px}}

.deskargilo svg{display:block;width:100%;height:100%}
.deskargilo circle{fill:none;stroke-width:2.4}
.ringo-fono{stroke:var(--lin)}
/* L'anneau part du haut et tourne dans le sens des aiguilles : d'où le
   quart de tour à rebours. Sa circonférence vaut 2*pi*20 = 125,66, et
   c'est ce nombre qui sert d'unité au décalage. */
.ringo-progreso{stroke:var(--azuro);stroke-linecap:round;
  stroke-dasharray:125.66; stroke-dashoffset:125.66;
  transform:rotate(-90deg); transform-origin:50% 50%;
  transition:stroke-dashoffset .3s ease-out}
.signo path{fill:none;stroke:var(--sub);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .16s}
.deskargilo:hover .signo path{stroke:var(--azuro)}
/* Un seul des trois signes paraît à la fois. */
.s-hoko,.s-rubo{display:none}
.deskargilo.preta .s-sago{display:none}
.deskargilo.preta .s-hoko{display:block}
.deskargilo.preta .signo path{stroke:var(--azuro)}
.deskargilo.preta .ringo-progreso{stroke-dashoffset:0}
.deskargilo.demandas .s-sago,.deskargilo.demandas .s-hoko{display:none}
.deskargilo.demandas .s-rubo{display:block}
.deskargilo.demandas .signo path{stroke:var(--flag,#b4552d)}
.deskargilo.demandas .ringo-progreso{stroke:var(--flag,#b4552d)}

/* Le compte, à droite du disque, seulement pendant la prise : « 23/66 MB »
   se lit partout, ce qui n'est pas le cas d'une phrase. */
.cifro{position:absolute; left:calc(var(--grando) + 11px); top:50%;
  transform:translateY(-50%); white-space:nowrap;
  font:600 12px/1 system-ui,sans-serif; letter-spacing:.03em;
  color:var(--sub); opacity:0; pointer-events:none; transition:opacity .2s}
.deskargilo.kuras .cifro{opacity:1}
@media (max-width:380px){.cifro{display:none}}

/* =====================================================================
   5. L'ENTREE — la roue arrive, et pose les lettres
   =====================================================================
   Au chargement, on ne voit d'abord que le disque : il entre par la
   gauche en ROULANT, et les deux lettres se tracent à mesure qu'il les
   dépasse. Puis la devise, les portes et le pied montent d'un cran.

   LA DISTANCE N'EST PAS CHOISIE A L'OEIL. Une roue qui roule tourne d'un
   angle proportionnel au chemin parcouru : un tour de 120 degrés vaut
   exactement un rayon fois 2*pi/3, soit 780,76 millièmes de cadratin. Le
   trajet vaut DEUX de ces tours — 1561,52 —, ce qui a deux conséquences
   heureuses :

     1. l'étoile étant invariante par rotation d'un tiers de tour, elle
        arrive dans sa position canonique sans le moindre recalage ;
     2. au départ, le bord droit du disque tombe à 249,3, et l'encre du I
        finit à 246 : le disque couvre exactement le I, ni plus ni moins.

   Le roulement est donc vrai, non mimé — et c'est la même figure que le
   clic fait tourner ensuite, d'un tiers de tour à son tour. */

/* Le disque déborde la boîte du dessin pendant qu'il entre ; la vue le
   recoupe, puisque la scène ne défile pas. */
.enkonduko .marko svg{overflow:visible}

.enkonduko .grupo-O{
  /* La boîte du groupe EST celle du disque — l'étoile y est inscrite —,
     donc son milieu est le centre du disque, et c'est autour de lui que
     la roue tourne. */
  transform-box:fill-box; transform-origin:center;
  animation:rular 1.55s cubic-bezier(.42,.02,.22,1) both;
}
@keyframes rular{
  from{transform:translateX(-1561.52px) rotate(-240deg)}
  to  {transform:translateX(0) rotate(0deg)}
}

/* LES LETTRES NE SONT PAS ANIMEES : C'EST UN RIDEAU QUI LES DECOUVRE.
   Elles étaient d'abord découpées chacune par sa propre animation, avec
   son propre retard — et la coupure verticale se détachait du disque, qui
   avait déjà roulé plus loin. On voyait la limite de l'animation au lieu
   de voir la roue poser les lettres.

   Le rideau est un rectangle de la couleur du papier, posé PAR-DESSUS les
   lettres et SOUS le disque, dont le bord gauche suit exactement le centre
   du disque : même durée, même retard, même courbe d'accélération, et une
   translation qui est la MEME fonction du temps. Les deux ne peuvent donc
   plus se désaccorder — ce n'est pas un réglage, c'est une identité.

   ET LA COUPURE EST INVISIBLE, parce que le disque est plus haut que les
   lettres : son diamètre vaut 745,6 contre 700 de hauteur de capitale. Au
   sommet des capitales, là où le disque est le plus étroit, il s'étend
   encore de 128,3 millièmes de part et d'autre de son centre. Le bord du
   rideau, qui passe par ce centre, est donc couvert sur toute la hauteur
   où il est peint.

   Le rideau est confiné à la boîte de l'encre des lettres : il s'efface de
   lui-même dès qu'il en sort, à la fin du roulement comme au repos. */
.enkonduko .kurteno{animation:movar 1.55s cubic-bezier(.42,.02,.22,1) both}
@keyframes movar{
  from{transform:translateX(-1561.52px)}
  to  {transform:translateX(0)}
}
.kurteno{fill:var(--pap)}

/* Le reste de la page monte d'un cran, une fois la marque posée. */
.enkonduko .devizo{animation:levar .55s ease-out 1.02s both}
.enkonduko .pordi {animation:levar .55s ease-out 1.16s both}
.enkonduko .pedo  {animation:levar .55s ease-out 1.30s both}
.enkonduko .deskargilo{animation:aparar .55s ease-out 1.42s both}
@keyframes levar{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* Le ciel se lève seul, plus lentement : il ne doit pas disputer le
   regard à la roue. Son opacité seule est animée — sa transformation
   sert déjà à la parallaxe. */
.enkonduko .cielo{animation:aparar 1.2s ease-out .55s both}
@keyframes aparar{from{opacity:0} to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .vorto{animation:none}
  /* L'entrée entière tombe : la page se peint dans son état final. */
  .enkonduko .grupo-O,.enkonduko .kurteno,.enkonduko .devizo,
  .enkonduko .pordi,.enkonduko .pedo,.enkonduko .cielo,
  .enkonduko .deskargilo{animation:none}
  .cielo{transition:none}
  .marko .stelo{transition:none}
  .pordo{transition:background .16s,color .16s}
}
</style>
</head>
<body>

<div class="sceno">
  <div class="cielo" id="cielo" aria-hidden="true"></div>

  <div class="bloko">
    <h1 class="marko">
      <button type="button" id="turno" aria-label="Ido">
        <svg viewBox="74 -22.79 1736.76 745.57" role="img" aria-hidden="true" focusable="false">
          <defs>
          <!-- La boîte de l'encre des deux lettres — x de 74 à 1019, y de 0
               à 700 — ELARGIE DE TROIS MILLIEMES sur les quatre côtés. Sans
               cette marge, le bord du rideau tombait exactement sur celui des
               lettres, et les deux anticrénelages ne se recouvraient pas tout
               à fait : il restait une ligne d'un pixel, azurée, sur la ligne
               de base. Le rideau étant de la couleur du papier, ses propres
               bords ne se voient pas.
               La marge ne compromet rien : à y = -3 comme à y = 703, le
               disque s'étend encore de 119,9 millièmes de part et d'autre de
               son centre, et couvre donc toujours le bord du rideau.
               Le rideau y est confiné, et disparaît de lui-même quand il en
               sort — à la fin du roulement, et au repos. -->
          <clipPath id="literkesto" clipPathUnits="userSpaceOnUse">
            <rect x="71" y="-3" width="951" height="706"/>
          </clipPath>
          </defs>
          <g transform="translate(0,700) scale(1,-1)" fill="currentColor">
          <path class="litero litero-I" transform="translate(0,0)" d="M74.0 700.0V0.0H246.0V700.0Z"/>

  <!-- LE DISQUE DE DESKARGO. Il occupe, sur la porte, la place que le
       bouton de retour occupe sur les trois livres : même coin, même
       taille, même écart — le coin porte « l'action globale », qui est le

       Aucun mot : une icône, et un anneau qui fait le tour. -->
  <button type="button" class="deskargilo" id="deskargi" hidden
          aria-label="Deskargar la tota sitio por senreta lekto">

<script>
/* =====================================================================
   LE CIEL
   =====================================================================
   « Langue auxiliaire internationale », dans les langues nationales.
   L'ordre alterne volontairement les familles et les ecritures : quand
   la fenetre est petite, seuls les premiers mots trouvent une place, et
   il faut que ce debut soit deja varie.
   ===================================================================== */
const VORTI = [
 ["Français","fr","langue auxiliaire internationale"],
 ["Русский","ru","международный вспомогательный язык"],
 ["日本語","ja","国際補助語"],
 ["English","en","international auxiliary language"],
 ["العربية","ar","لغة مساعدة دولية"],
 ["Suomi","fi","kansainvälinen apukieli"],
 ["中文","zh","国际辅助语"],
 ["Español","es","lengua auxiliar internacional"],
 ["Türkçe","tr","uluslararası yardımcı dil"],
 ["Ελληνικά","el","διεθνής βοηθητική γλώσσα"],
 ["Deutsch","de","internationale Hilfssprache"],
 ["हिन्दी","hi","अंतर्राष्ट्रीय सहायक भाषा"],
 ["Polski","pl","międzynarodowy język pomocniczy"],
 ["한국어","ko","국제 보조어"],
 ["Italiano","it","lingua ausiliaria internazionale"],
 ["עברית","he","שפת עזר בינלאומית"],
 ["Magyar","hu","nemzetközi segédnyelv"],
 ["Kiswahili","sw","lugha saidizi ya kimataifa"],
 ["Português","pt","língua auxiliar internacional"],
 ["ไทย","th","ภาษาช่วยระหว่างประเทศ"],
 ["Nederlands","nl","internationale hulptaal"],
 ["Українська","uk","міжнародна допоміжна мова"],
 ["Latina","la","lingua auxiliaris internationalis"],
 ["Tiếng Việt","vi","ngôn ngữ phụ trợ quốc tế"],
 ["Svenska","sv","internationellt hjälpspråk"],
 ["فارسی","fa","زبان کمکی بین‌المللی"],
 ["Čeština","cs","mezinárodní pomocný jazyk"],
 ["ქართული","ka","საერთაშორისო დამხმარე ენა"],
 ["Català","ca","llengua auxiliar internacional"],
 ["Bahasa Indonesia","id","bahasa bantu internasional"],
 ["Dansk","da","internationalt hjælpesprog"],
 ["বাংলা","bn","আন্তর্জাতিক সহায়ক ভাষা"],
 ["Română","ro","limbă auxiliară internațională"],
 ["Հայերեն","hy","միջազգային օժանդակ լեզու"],
 ["Norsk","no","internasjonalt hjelpespråk"],
 ["Български","bg","международен спомагателен език"],
 ["Esperanto","eo","internacia helplingvo"],
 ["தமிழ்","ta","சர்வதேச துணை மொழி"],
 ["Slovenčina","sk","medzinárodný pomocný jazyk"],
 ["Қазақ","kk","халықаралық көмекші тіл"],
 ["Íslenska","is","alþjóðlegt hjálpartungumál"],
 ["Hrvatski","hr","međunarodni pomoćni jezik"],
 ["Монгол","mn","олон улсын туслах хэл"],
 ["Eesti","et","rahvusvaheline abikeel"],
 ["Српски","sr","међународни помоћни језик"],
 ["Interlingua","ia","lingua auxiliar international"],
 ["Lietuvių","lt","tarptautinė pagalbinė kalba"],
 ["Afrikaans","af","internasionale hulptaal"],
 ["Slovenščina","sl","mednarodni pomožni jezik"],
 ["Oʻzbek","uz","xalqaro yordamchi til"],
 ["Latviešu","lv","starptautiskā palīgvaloda"],
 ["Shqip","sq","gjuhë ndihmëse ndërkombëtare"],
 ["Gaeilge","ga","teanga chúnta idirnáisiúnta"],
 ["Bahasa Melayu","ms","bahasa bantuan antarabangsa"],
 ["Malti","mt","lingwa awżiljarja internazzjonali"],
 ["Cymraeg","cy","iaith gynorthwyol ryngwladol"],
 ["Galego","gl","lingua auxiliar internacional"],
 ["Euskara","eu","nazioarteko laguntza-hizkuntza"],
 ["Filipino","fil","pandaigdigang wikang pantulong"]
];

/* Un tirage PSEUDO-aleatoire, mais a graine fixe : la disposition est la
   meme a chaque visite pour une meme fenetre. Elle a ete reglee a l'oeil ;
   un vrai hasard la referait a chaque chargement, et parfois moins bien. */
function hazardo(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296}}

const cielo=document.getElementById('cielo');
const bloko=document.querySelector('.bloko');
let pozita=[];

function semar(){
  cielo.textContent='';
  const L=cielo.clientWidth, A=cielo.clientHeight;
  if(!L||!A) return;

  const b=bloko.getBoundingClientRect();
  const c=document.querySelector('.pedo').getBoundingClientRect();
  const interdikto=[];

  /* Le corps suit la fenetre : sur un telephone, les memes corps qu'un
     grand ecran donneraient trois mots et rien d'autre. */
  const eskalo=Math.min(1,L/1040)*(A<560?.86:1);
  const KORPI=[21,15,13,17,12,14,19,12.5,16,13.5];
  const r=hazardo(0x1D0);
  pozita=[];

  /* Sur une petite fenetre, le bloc central mange les deux tiers de la
     place : sans desserrer les ecarts et sans multiplier les essais, il
     ne resterait que six ou sept mots, et le ciel serait vide. */
  const strita=L<560;
  const MARJ=strita?12:26, INTERV=strita?8:13,
        ESAI=strita?260:110, MINKORP=strita?9.5:10.5;

  /* Le bloc central, elargi : rien ne s'en approche. */
  interdikto.push({x:b.left-MARJ,y:b.top-MARJ,w:b.width+2*MARJ,h:b.height+2*MARJ});
  if(c.height) interdikto.push({x:c.left,y:c.top-12,w:c.width,h:c.height+16});
  /* Le disque de deskargo, et la place que prend son compte à droite. La
     marge est celle du bloc central, et pour la même raison : les mots
     DERIVENT une fois posés, de treize pixels au plus. Une réserve juste
     assez large pour le rectangle laisserait un mot entrer en flottant. */
  const d=document.querySelector('.deskargilo');
  if(d){const rd=d.getBoundingClientRect();
    if(rd.width) interdikto.push({x:rd.left-MARJ, y:rd.top-MARJ,
      w:rd.width+MARJ+120, h:rd.height+2*MARJ});}

  for(let i=0;i<VORTI.length;i++){
    const [lg,kodo,tx]=VORTI[i];
    const s=document.createElement('span');
    s.className='vorto'; s.lang=kodo; s.dir='auto';
    s.dataset.lg=lg; s.textContent=tx;
    const sz=Math.max(MINKORP,KORPI[i%KORPI.length]*eskalo);
    s.style.setProperty('--sz',sz.toFixed(1)+'px');
    s.style.visibility='hidden'; s.style.left='0'; s.style.top='0';
    cielo.appendChild(s);
    const l=s.offsetWidth, h=s.offsetHeight;
    if(l>L-24){s.remove();continue}

    let pozo=null;
    for(let p=0;p<ESAI;p++){
      const x=12+r()*(L-l-24), y=10+r()*(A-h-20);
      const kand={x,y,w:l,h};
      if(interdikto.some(k=>kolizo(kand,k,0))) continue;
      if(pozita.some(k=>kolizo(kand,k,INTERV))) continue;
      pozo=kand; break;
    }
    if(!pozo){s.remove();continue}
    pozita.push(pozo);

    /* Plus un mot est loin du centre, plus il s'affirme : le regard va
       ainsi au bloc, et le ciel reste un fond. */
    const dx=(pozo.x+l/2)/L-.5, dy=(pozo.y+h/2)/A-.5;
    const fora=Math.min(1,Math.hypot(dx*1.15,dy)*2.1);
    s.style.setProperty('--op',(.17+fora*.26).toFixed(3));
    s.style.left=Math.round(pozo.x)+'px';
    s.style.top=Math.round(pozo.y)+'px';
    s.style.setProperty('--dx',(4+r()*9).toFixed(1)+'px');
    s.style.setProperty('--dy',(4+r()*8).toFixed(1)+'px');
    s.style.setProperty('--dur',(26+r()*26).toFixed(1)+'s');
    s.style.setProperty('--del',(-r()*40).toFixed(1)+'s');
    s.style.visibility='';
  }
}
function kolizo(a,b,m){
  return a.x < b.x+b.w+m && a.x+a.w+m > b.x &&
         a.y < b.y+b.h+m && a.y+a.h+m > b.y;
}

/* Les polices changent la largeur des mots : on seme une premiere fois
   tout de suite, puis a nouveau quand elles sont la. */
semar();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(semar);

let horlojo;
addEventListener('resize',()=>{clearTimeout(horlojo);horlojo=setTimeout(semar,160)});
addEventListener('orientationchange',()=>setTimeout(semar,260));

/* --- La parallaxe. Quelques pixels, et seulement sous un vrai pointeur. */
if(matchMedia('(hover:hover) and (pointer:fine)').matches &&
   !matchMedia('(prefers-reduced-motion:reduce)').matches){
  addEventListener('pointermove',e=>{
    const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
    cielo.style.setProperty('--px',(-x*16).toFixed(1)+'px');
    cielo.style.setProperty('--py',(-y*12).toFixed(1)+'px');
  },{passive:true});
}

/* =====================================================================
   LA FIN DE L'ENTREE
   =====================================================================
   La classe est posée dans le HTML et non par le script : sinon la page
   serait peinte une fois dans son état final avant que le script n'agisse,
   et l'entrée commencerait par un sursaut.

   On la retire quand la roue s'arrête — ce qui rend au dessin sa boîte
   normale — mais aussi au premier geste : qui touche la page a autre
   chose à faire que regarder une animation. Le retrait fige tout dans
   l'état final, l'entrée est donc abrégeable à tout instant.

   Sans JavaScript, la classe reste et rien ne change : l'animation se
   termine d'elle-même sur l'état final.
   ===================================================================== */
const rado=document.documentElement;
function finiEnkonduko(){rado.classList.remove('enkonduko')}
document.querySelector('.grupo-O')
  .addEventListener('animationend', finiEnkonduko, {once:true});
addEventListener('pointerdown', finiEnkonduko, {once:true});
addEventListener('keydown', finiEnkonduko, {once:true});
/* Filet : une animation qui n'aurait jamais démarré — onglet ouvert en
   arrière-plan, par exemple — ne doit pas laisser la classe à demeure. */
setTimeout(finiEnkonduko, 3200);

/* =====================================================================
   LE SERVANTO — hors-ligne
   =====================================================================
   Posé à la racine, il a pour portée tout le site : la porte ET les trois
   livres, qui sont servis sous la même origine. Les trois dépôts n'ont
   donc rien à porter. Le détail des règles est dans sw.js.

   Le corps des livres — douze méga-octets — n'est pris d'avance QUE si la
   page tourne comme application installée. Un visiteur qui ne fait que
   passer par la porte n'a pas à payer ce prix ; chez lui, chaque page se
   met en cache à la lecture.

   Au retour de la connexion, on redemande le servanto lui-même et on lui
   fait revalider ce qu'il détient : les textes sont corrigés souvent, et
   une copie ne doit pas survivre à sa correction.
   ===================================================================== */
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', {updateViaCache:'none'});
      await navigator.serviceWorker.ready;
      const instalita = matchMedia('(display-mode: standalone)').matches
                        || navigator.standalone === true;
      const diri = m => reg.active && reg.active.postMessage(m);

      /* --- LA LEKTO SENRETA ------------------------------------------
         Le site entier pèse une soixantaine de méga-octets : les trois
         textes, les PDF, les 52 langues et les 38 planches gravées dans
         leurs deux résolutions.

         INSTALLÉE, l'application le prend d'elle-même — c'est ce qu'on
         attend d'une application, et c'est le moment le plus proche de
         l'ajout à l'écran d'accueil qu'un site puisse observer : iOS
         n'annonce pas cet ajout.

         DANS UN ONGLET, rien n'est pris sans qu'on le demande : un
         visiteur de passage n'a pas à payer soixante méga-octets. Le
         bouton le propose, et la barre dit où l'on en est.

         La demande de stockage durable écarte, sur Chrome, l'effacement
         automatique quand la place manque ; iOS l'accorde d'office aux
         applications de l'écran d'accueil. */
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

      const butono = document.getElementById('deskargi');
      const ringo  = document.getElementById('ringo');
      const cifro  = document.getElementById('cifro');
      const KURBO  = 125.66;                       /* 2*pi*20, la circonférence */
      const mb = o => Math.round(o / 1048576);
      let stato = 'ripozas';                       /* ripozas | kuras | preta | demandas */
      let horlojeto = 0;

      /* Le ciel a été semé avant que ce bouton ne paraisse — son rectangle
         était alors nul, et des mots pouvaient tomber dessous. On resème
         une fois qu'il occupe sa place. */
      butono.hidden = false;
      semar();

      const pozi = (nova, etikedo) => {
        stato = nova;
        butono.classList.toggle('kuras',    nova === 'kuras');
        butono.classList.toggle('preta',    nova === 'preta');
        butono.classList.toggle('demandas', nova === 'demandas');
        butono.setAttribute('aria-label', etikedo);
      };

      navigator.serviceWorker.addEventListener('message', ev => {
        const m = ev.data || {};
        if (m.tipo === 'stato' && m.totalaj && m.faritaj >= m.totalaj) {
          ringo.style.strokeDashoffset = 0;
          pozi('preta', 'La tota sitio esas senrete disponebla — klikez por efacar');
        }
        if (m.tipo === 'progreso') {
          const p = m.totalaj ? m.faritaj / m.totalaj : 0;
          ringo.style.strokeDashoffset = (KURBO * (1 - p)).toFixed(2);
          /* Le compte dit ce qui est DESCENDU, sans dénominateur : c'est
             l'anneau qui dit la part faite, et un total annoncé d'avance
             reposerait sur une estimation — les fichiers non versionnés
             n'annoncent pas leur taille. */
          cifro.textContent = mb(m.oktetoj) + ' MB';
          pozi('kuras', 'Deskargas… ' + Math.round(p * 100) + ' %');
        }
        if (m.tipo === 'preta') {
          ringo.style.strokeDashoffset = 0;
          cifro.textContent = mb(m.oktetoj) + ' MB';
          pozi('preta', 'La tota sitio esas senrete disponebla — klikez por efacar');
        }
        if (m.tipo === 'rompita') {
          pozi('ripozas', 'Interruptita — klikez por probar itere');
        }
        if (m.tipo === 'forgesita') {
          ringo.style.strokeDashoffset = KURBO;
          cifro.textContent = '';
          pozi('ripozas', 'Deskargar la tota sitio por senreta lekto');
        }
      });

      /* Trois clics possibles, selon l'état. Sur l'état « prêt », le
         premier clic ARME seulement : effacer soixante-six méga-octets par
         mégarde serait pénible, et une confirmation en toutes lettres
         reviendrait à remettre du texte. Le signe devient une corbeille
         pendant quatre secondes ; un second clic efface, sinon on revient
         en arrière tout seul. */
      butono.addEventListener('click', () => {
        clearTimeout(horlojeto);
        if (stato === 'ripozas') { diri('tuto'); pozi('kuras', 'Deskargas…'); return; }
        if (stato === 'preta') {
          pozi('demandas', 'Efacar la deskargita kontenajo? Klikez itere por konfirmar');
          horlojeto = setTimeout(() => pozi('preta',
            'La tota sitio esas senrete disponebla — klikez por efacar'), 4000);
          return;
        }
        if (stato === 'demandas') { diri('forgesi'); return; }
      });

      diri('stato');
      if (instalita) setTimeout(() => diri('tuto'), 4000);

      addEventListener('online', () => {
        reg.update();
        diri('refresho');
      });
    } catch (_) { /* sans servanto, la page reste entière */ }
  });
}

/* --- L'etoile. Un tiers de tour : la figure revient sur elle-meme. */
let anguli=0;
document.getElementById('turno').addEventListener('click',()=>{
  anguli+=120;
  document.querySelector('.marko .stelo').style.rotate=anguli+'deg';
});
</script>
